services:
  postgres:
    image: postgres:16-alpine
    container_name: depthsignals-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass123
      POSTGRES_DB: kewltech_trading
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d kewltech_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
