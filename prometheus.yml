global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kewltech-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000', 'localhost:5000', 'app:5000']
        labels:
          service: kewltech

  # Example: scrape other services (node_exporter, postgres exporter) if added
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']
